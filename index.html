<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Career Days 2026 · Medical University of Innsbruck</title>
<meta name="description" content="Programme, speakers and workshops of the Career Days 2026 at the Medical University of Innsbruck, 24–25 November 2026.">
<meta name="theme-color" content="#1D596B">
<style>
/* Layout: phone-first single column, fixed bottom tab bar, white logo plate over a
   Blumine identity band. Palette and type from the Med Uni Innsbruck CI styleguide. */
:root{
  --bg:#f4f6f7;
  --surface:#ffffff;
  --surface-2:#eef2f4;
  --ink:#333333;        /* Mine Shaft */
  --muted:#666666;      /* Dove Gray */
  --line:#dde5e8;
  --brand:#1D596B;      /* Blumine */
  --brand-deep:#164753;
  --brand-mid:#4F8CA6;  /* Wedgewood */
  --accent:#357991;     /* Calypso */
  --chip:#e6eef1;
  --live:#E60000;       /* MUI Red — live signal only */
  --live-soft:#fdeaea;
  --on-brand:#ffffff;
  --shadow:0 1px 2px rgba(29,89,107,.06),0 8px 24px rgba(29,89,107,.06);
  --f-ui:'Corporate S',Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f181b; --surface:#162227; --surface-2:#1d2b31;
    --ink:#e7eef0; --muted:#a3b4ba; --line:#27373d;
    --brand:#2d6b7e; --brand-deep:#1b4855;
    --brand-mid:#84ABC1; --accent:#84ABC1; --chip:#1f3138;
    --live:#ff6b6b; --live-soft:#3a1c1c; --on-brand:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f181b; --surface:#162227; --surface-2:#1d2b31;
  --ink:#e7eef0; --muted:#a3b4ba; --line:#27373d;
  --brand:#2d6b7e; --brand-deep:#1b4855;
  --brand-mid:#84ABC1; --accent:#84ABC1; --chip:#1f3138;
  --live:#ff6b6b; --live-soft:#3a1c1c; --on-brand:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.logoplate{background:#fff;padding-block:10px;border-bottom:1px solid var(--line)}
.logoplate img{height:74px;width:auto;display:block}
.band{background:linear-gradient(155deg,var(--brand),var(--brand-deep));color:var(--on-brand);padding-block:14px 16px}
.band .kick{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.78}
.band h1{font-size:25px;line-height:1.08;margin:3px 0 2px;font-weight:700;text-wrap:balance}
.band .tag{font-size:14px;opacity:.9}
.band .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:12.5px;opacity:.88}

/* generic */
main{padding-block:14px 92px}
.seclabel{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-mid);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
.seclabel:first-child{margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px}

/* day switch */
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.pill .sub{font-weight:400;opacity:.7}
.ghost{margin-left:auto;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:600}
.ghost[aria-pressed="true"]{border-style:solid;border-color:var(--live);color:var(--live);background:var(--live-soft)}

/* session rows */
.srow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.srow.live{border-color:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.srow .time{min-width:46px;flex:none}
.srow .time b{display:block;font-size:13.5px;color:var(--brand-mid);font-variant-numeric:tabular-nums}
.srow .body{flex:1;min-width:0}
.srow .ttl{font-size:14.5px;font-weight:700;line-height:1.25;text-wrap:balance}
.srow .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.srow .foot{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:11.5px;color:var(--muted)}
.kind{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-mid)}
.livetag{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--live)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;margin-right:4px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.askflag{color:var(--accent);font-weight:600}
.bm{flex:none;background:transparent;border:0;padding:3px;color:#b9c6cc;line-height:0}
.bm[aria-pressed="true"]{color:var(--accent)}
.bm svg{width:20px;height:20px}

/* people */
.people{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:430px){.people{grid-template-columns:1fr 1fr}}
.pcard{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.ava{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;background:var(--chip)}
.mono{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--brand-mid);color:#fff;font-weight:700;font-size:17px}
.pname{font-size:13.5px;font-weight:700;line-height:1.2}
.prole{font-size:11.5px;font-weight:600;color:var(--accent);margin-top:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,30,36,.5);z-index:60;display:flex;justify-content:center;align-items:flex-end}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 10px 0;background:linear-gradient(var(--surface),var(--surface) 72%,transparent)}
.xbtn{background:var(--surface-2);border:0;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.sheetbody{padding:0 16px 20px;margin-top:-30px}
.sheetbody h2{font-size:20px;line-height:1.18;margin:6px 0 0;text-wrap:balance}
.sheetmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.venuebox{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--ink)}
.venuebox span{min-width:0}
.prose{font-size:13.5px;line-height:1.55;margin-top:11px}
.prose p{margin:0 0 8px}
.takeaways{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.takeaways li{margin-bottom:3px}
.btn{width:100%;border-radius:11px;padding:11px;font-size:13.5px;font-weight:700;border:1px solid var(--brand);background:var(--surface);color:var(--brand);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.btn.primary{background:var(--brand);color:var(--on-brand)}

/* question form sheet */
.formsheet{width:100%;max-width:560px;height:92vh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;overflow:hidden}
.formbar{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.formbar .t{flex:1;min-width:0}
.formbar .t b{display:block;font-size:15px;line-height:1.2}
.formbar .t span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.formwrap{flex:1;min-height:0;background:var(--surface-2)}
.formwrap iframe{width:100%;height:100%;border:0;display:block}
.formfoot{border-top:1px solid var(--line);padding:10px 16px;background:var(--surface)}
.formfoot a{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;text-decoration:none;font-weight:600}

/* notices / empty */
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.notice b{color:var(--ink)}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}

/* ask list */
.askrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.askrow .body{flex:1;min-width:0}
.askrow .ttl{font-size:14px;font-weight:700;line-height:1.25}
.askrow .sub{font-size:12px;color:var(--muted);margin-top:3px}
.askrow .go{flex:none;color:var(--accent);line-height:0}
.askrow .go svg{width:20px;height:20px}

/* info */
.inforow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow)}
.inforow .k{font-size:13px;font-weight:700}
.inforow .v{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(155deg,var(--brand),var(--brand-deep));color:var(--on-brand);border-radius:14px;padding:15px 16px;margin-top:4px}
.cta .t{font-size:14.5px;font-weight:700}
.cta .l{font-size:12px;opacity:.9;margin-top:3px;word-break:break-all}
.cta a{color:#dbe9ef}
.suplogos{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.suplogos img{height:30px;width:auto}

/* tab bar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));z-index:50}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--brand-mid)}
nav.tabs svg{width:21px;height:21px}
nav.tabs .lbl{font-size:10px;font-weight:600}
.badge{position:absolute;top:-5px;right:50%;margin-right:-20px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:16px;text-align:center}
</style>
</head>

   sub:"Fireside Chat · Networking", venue:"fireside", end:"19:15",
   people:["eichhorn","riesinger","tausz"],
   desc:"Are traditional academic career paths still fit for purpose? This fireside chat brings together senior researchers and policy-makers to explore how academic careers are changing and where current structures fall short. The discussion will consider alternative career models, barriers to change, and practical steps towards creating more diverse, flexible, and sustainable career paths that better serve both researchers and society."},

   sub:"Self-awareness for career orientation · Nicola Bauer", people:["bauer"],
   desc:"Often unsure how to approach the next career step, many early career researchers directly start searching for job options without taking the time to reflect where they are standing today in life and what is truly important to them. The latter, however, facilitates informed decision making and a successful career transition.\n\nIn this interactive workshop, participants will discover their values and their Why — that's where meaning and motivation lie. Through guided reflection, practical exercises, and peer exchange, they will increase their awareness about what fulfills them, which empowers them to take steps towards the next career decision that suits them best.",
   takeaways:["Understanding of what is important to you","Discovery of your purpose and inner drivers","Approaches and tools for a successful career orientation"]},

   sub:"Recognise the skills you already have · Nicola Bauer", people:["bauer"],
   desc:"During a scientific journey, early career researchers develop far more than specialized expertise — they continuously strengthen a whole range of transferable skills. While mostly taken for granted by doctoral researchers and postdocs, these competencies are highly valued in various careers both inside and outside academia.\n\nThis interactive workshop supports experienced doctoral researchers and postdocs in identifying the valuable transferable skills they possess for their upcoming career transition. Through guided reflection, practical exercises, and peer exchange, participants will learn how to recognise and confidently communicate these strengths.",
   takeaways:["Identification of key transferable skills gained during the scientific journey","Reflection on strengths developed through academic challenges and research","Communication of competencies through concrete examples and storytelling"]},

   desc:"Good preparation can make a significant difference in how confidently and clearly you present yourself in a job interview. In this interactive workshop, participants will explore key steps in preparing for an interview, from analysing the position and anticipating relevant questions to identifying convincing examples from their own experience. Short practical exercises will help participants apply these strategies to their own job search."},

const PEOPLE = {
  hautz:{n:"Julia Hautz", r:"Professor of Strategic Management, University of Innsbruck",
    b:"Professor of Strategic Management at the University of Innsbruck since 2019. She completed her doctorate sub auspiciis at the University of Innsbruck, held a professorship in strategy at the University of Cologne and was a visiting scholar at the University of Bath and the University of Oxford. In her research, teaching and work with companies she focuses on strategy processes, open strategy, and digital technologies and AI in strategy work. She is co-author of “Exploring Strategy”, one of the most influential strategy textbooks worldwide, and of “Open Strategy” (MIT Press, 2021), named Best Business Book of the Month by the Financial Times. Her new book “Your Life Needs A Strategy” will be published next year by Harvard Business Press. Her research has appeared in Harvard Business Review, the Strategic Management Journal and MIT Sloan Management Review among others, and has been nominated for the Thinkers50 Strategy Award, the “Oscars of management thinking”."},
  hofmann:{n:"Julia Hofmann", r:"Session Chair · Postdoctoral scientist, organLife",

  kohlhammer:{n:"Leonie Kohlhammer", r:"Senior Consultant, Scitaris",

  obermayer:{n:"Georg Obermayer", r:"Physician-scientist · MD, PhD",

  schmidt:{n:"Daniela Schmidt", r:"Senior Clinical Scientist, Roche",

  thurner:{n:"Marco Thurner", r:"Patent Attorney, Thurner IP",

  elghaleb:{n:"Yousra El Ghaleb", r:"Session Chair · Group leader (FWF ESPRIT), MUI",
    b:"Completed her PhD at the Medical University of Innsbruck, identifying CACNA1I as a disease gene for neurodevelopmental disorders. An FWF ESPRIT awardee (2023), she now leads her own group on CACNA1I channelopathies and is a representative of the Med Uni Innsbruck Postdoc Network."},
  gerold:{n:"Gisa Gerold", r:"Director, Institute of Virology, MUI",

  tebb:{n:"Graham Tebb", r:"Research funding & mentoring, MUI",
    b:"Biochemistry at Oxford, a doctorate at EMBL Heidelberg and a postdoc at the IMP Vienna — then a career away from the bench: editor at Nature, administrator at the UN and the Austrian Science Fund, and since 2010 at Vetmeduni Vienna (MedUni Innsbruck since 2024). He helps researchers secure funding and runs soft-skills courses and an early-career mentoring programme."},
  bozatzi:{n:"Polina Bozatzi", r:"Research Project Coordinator, ISTA",
    b:"Research-driven project manager with 10+ years in biomedical research and EU-funded project coordination. After a PhD in biochemistry and cell signalling (University of Dundee) and a postdoc in paediatric oncology, she moved into project management and is now Research Project Coordinator at the Institute of Science and Technology Austria (ISTA)."},
  krogsdam:{n:"Anne Krogsdam", r:"Ass. Prof. Bioinformatics · MultiOmics Core, MUI",
    b:"Associate professor at the Institute of Bioinformatics and head of the MultiOmics Sequencing Core Facility at the Medical University of Innsbruck. After a PhD at the University of Southern Denmark and postdoctoral research in Graz and Innsbruck, her work spans transcriptional regulation, single-cell sequencing in cancer and immunology, and spatial transcriptomics."},
  stefan:{n:"Eduard Stefan", r:"Co-founder & CEO, KinCon biolabs",

  krahulec:{n:"Stefan Krahulec", r:"Head of Deep Technologies, aws",
    b:"Dipl.-Ing. Dr. techn. Stefan Krahulec has led the Deep Technologies department at Austria Wirtschaftsservice (aws) since December 2025. A biotechnologist by training, he spent 2011–2025 at Boehringer Ingelheim in Vienna, most recently as Head of Biopharma Technology & Innovation Management, following postdoctoral research at Graz University of Technology and lecturing roles at universities of applied sciences. His expertise sits at the interface of biotechnology, technology management and innovation funding."},
  wick:{n:"Gregor Wick", r:"Co-founder & CEO, Angios biotech",
    b:"Gregor has been an entrepreneur and consultant in life sciences and biotech for 30 years, working with global management consultancies across Europe and the US. He has founded several healthcare start-ups and advises venture-capital and life-science companies. He holds an MA and a PhD in business administration and economics from the Vienna University of Economics (WU)."},
  eichhorn:{n:"Kristin Eichhorn", r:"Co-initiator, #IchBinHanna",
    b:"PD Dr. and substitute professor of Modern German Literature at the University of Stuttgart. Co-initiator of #IchBinHanna and a prominent voice against precarity in German academia."},
  riesinger:{n:"Katharina Riesinger", r:"BMFWF · Higher Education Strategy 2040",
    b:"Background in the humanities and social sciences; at the Austrian Federal Ministry (BMFWF) since 2021, where she coordinates the Higher Education Strategy 2040 and works on the advancement of academic careers."},
  tausz:{n:"Karin Tausz", r:"Managing Director, Austrian Research Promotion Agency (FFG)",
    b:"Managing Director of the FFG since 2023. Previous experience includes innovation and research management and corporate development at the Austrian Federal Railways, the Swiss Federal Railways, the automotive sector, and the Austrian Institute of Technology (AIT)."},
  bauer:{n:"Nicola Bauer", r:"Systemic career coach, JoyWorks",
    b:"Trainer and systemic coach for doctoral researchers and postdocs, focused on purposeful career development, self-awareness and mental health. After a doctorate in stem-cell biology (MPI-CBG Dresden), pharma consulting and a second degree in psychology, she founded JoyWorks Trainings in 2023."},
  stipsits:{n:"Stefanie Stipsits", r:"Expert People Development, LBG Career Center",
    b:"Experience in various HR roles across academia, the private sector and the non-profit sector in Austria and Germany, with focus on human resource management, people development and recruitment. Now working in Career & People Development at the LBG Career Center, supporting pre- and postdoctoral researchers in actively shaping their careers."},
  pereira:{n:"Lisa Maria Pereira de Lima", r:"Expert People Development, LBG Career Center",
    b:"Background in education and adult learning, with experience spanning learning and development, HR-related topics, innovative teaching and the design and facilitation of training and e-learning formats for diverse target groups. She currently works as a People Development Expert at the LBG Career Center, supporting researchers at all career stages as well as contributing to internal people development across LBG."}
};

const GROUPS = [
  {label:"Keynote", ids:["hautz"]},
  {label:"Career Paths beyond Academia", ids:["hofmann","kohlhammer","obermayer","schmidt","thurner"]},
  {label:"Career Paths within Academia", ids:["elghaleb","gerold","tebb","bozatzi","krogsdam"]},
  {label:"Entrepreneurship Panel", ids:["stefan","krahulec","wick"]},
  {label:"Fireside Chat", ids:["eichhorn","riesinger","tausz"]},
  {label:"Workshop Trainers", ids:["bauer","stipsits","pereira"]}
];

/* ============================================================ STATE */
const S = { tab:"programme", day:"d1", preview:false, plan:[], sheet:null };

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const byId = id => SESSIONS.find(s => s.id === id);
const daySessions = d => SESSIONS.filter(s => s.day === d);
const hasForm = id => Boolean(FORMS[id]);

function sessionEnd(s){
  if (s.end) return s.end;
  const list = daySessions(s.day), i = list.indexOf(s);
  return i < list.length-1 ? list[i+1].t : DAYS.find(d => d.id === s.day).end;
}
function liveId(){
  let now, today;
  if (S.preview){ now = 16*60+40; today = "2026-11-24"; }
  else {
    const d = new Date();
    now = d.getHours()*60 + d.getMinutes();
    today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  const day = DAYS.find(d => d.date === today);
  if (!day) return null;
  const s = daySessions(day.id).find(x => now >= mins(x.t) && now < mins(sessionEnd(x)));
  return s ? s.id : null;
}

function loadPlan(){
  try { S.plan = JSON.parse(localStorage.getItem("cd26:plan") || "[]"); } catch { S.plan = []; }
  if (!Array.isArray(S.plan)) S.plan = [];
}
function savePlan(){ try { localStorage.setItem("cd26:plan", JSON.stringify(S.plan)); } catch {} }

/* ---------- icons ---------- */
const I = {
  cal:'<path d="M7 3v3M17 3v3M3.5 9h17M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 19 20.5H5A1.5 1.5 0 0 1 3.5 19V7A1.5 1.5 0 0 1 5 5.5Z"/>',
  users:'<path d="M16 19v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V19M9 9.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM22 19v-1.5a4 4 0 0 0-3-3.87M16 2.63a4 4 0 0 1 0 7.75"/>',
  chat:'<path d="M20.5 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.8-5.4A7.5 7.5 0 1 1 20.5 11.5Z"/>',
  book:'<path d="M18 20.5 12 17l-6 3.5v-16A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5Z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="m4 12.5 5 5 11-11"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  pin:'<path d="M20 10.5c0 5.5-8 11-8 11s-8-5.5-8-11a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10.5" r="2.6"/>',
  ext:'<path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5.5A1.5 1.5 0 0 1 16.5 21h-12A1.5 1.5 0 0 1 3 19.5v-12A1.5 1.5 0 0 1 4.5 6H10"/>'
};
const svg = (p, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;

/* ============================================================ VIEWS */
function sessionRow(s, live){
  const booked = S.plan.includes(s.id);
  return `<div class="srow${live?" live":""}" data-open="${s.id}" role="button" tabindex="0">
    <div class="time"><b>${s.t}</b></div>
    <div class="body">
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        <span class="kind">${KIND[s.kind]}</span>
        ${live?`<span class="livetag"><span class="dot"></span>LIVE NOW</span>`:""}
      </div>
      <div class="ttl">${esc(s.title)}</div>
      ${s.sub?`<div class="sub">${esc(s.sub)}</div>`:""}
      <div class="foot">
        <span>${esc(venueOf(s).short)}</span>
        ${hasForm(s.id)?`<span class="askflag">Ask a question</span>`:""}
      </div>
    </div>
    <button class="bm" data-plan="${s.id}" aria-pressed="${booked}" aria-label="Save to my plan">
      ${svg(I.book, booked?'fill="currentColor"':"")}
    </button>
  </div>`;
}

function viewProgramme(){
  const live = liveId();
  return `
    <div class="daybar">
      ${DAYS.map(x=>`<button class="pill" data-day="${x.id}" aria-pressed="${S.day===x.id}">
        ${x.label}<span class="sub"> · ${x.nice.split(", ")[1]}</span></button>`).join("")}
      <button class="ghost" data-preview aria-pressed="${S.preview}">${S.preview?"Preview on":"Preview live view"}</button>
    </div>
    <div class="notice" style="margin-bottom:10px">
      <b>Fritz-Pregl-Straße 3, 8th floor.</b>
      ${S.day==="d1"
        ? "The Fireside Chat in the evening is the exception — it is held at the Faculty Club, Schöpfstraße 41."
        : "Workshops run one after another. Each is limited to 30 participants."}
    </div>
    <div class="stack">${daySessions(S.day).map(s=>sessionRow(s, live===s.id)).join("")}</div>
  `;
}

function personCard(id){
  const p = PEOPLE[id], img = ASSETS.photos[id];
  const ini = p.n.split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
  return `<button class="pcard" data-person="${id}">
    ${img?`<img class="ava" src="${img}" alt="">`:`<div class="mono">${ini}</div>`}
    <span style="flex:1;min-width:0">
      <span class="pname" style="display:block">${esc(p.n)}</span>
      <span class="prole" style="display:block">${esc(p.r)}</span>
    </span>
  </button>`;
}

function viewSpeakers(){
  return GROUPS.map(g => `<div class="seclabel">${esc(g.label)}</div>
    <div class="people">${g.ids.map(personCard).join("")}</div>`).join("");
}

function viewQuestions(){
  const list = SESSIONS.filter(s => hasForm(s.id));
  return `
    <div class="seclabel">Ask the panel</div>
    <div class="notice" style="margin-bottom:12px">
      <b>Your question goes straight to the session chair.</b><br>
      Send it in advance or during the session — the chair brings the questions into the discussion. You can stay anonymous.
    </div>
    <div class="stack">
      ${list.map(s => `<button class="askrow" data-form="${s.id}">
        <div class="body">
          <div class="ttl">${esc(s.title)}</div>
          <div class="sub">${s.t} · ${esc(DAYS.find(d=>d.id===s.day).nice)}</div>
        </div>
        <span class="go">${svg(I.arrow)}</span>
      </button>`).join("")}
    </div>`;
}

function viewPlan(){
  if (!S.plan.length){
    return `<div class="empty">
      <div class="big">Your plan is empty</div>
      Tap the bookmark on any session to build your personal schedule. It is stored on this device only.
      <div style="margin-top:14px"><button class="pill" data-go="programme" style="font-weight:700">Browse the programme</button></div>
    </div>`;
  }
  const live = liveId();
  return DAYS.map(d => {
    const items = daySessions(d.id).filter(s => S.plan.includes(s.id));
    if (!items.length) return "";
    return `<div class="seclabel">${d.label} · ${esc(d.nice)}</div>
      <div class="stack">${items.map(s=>sessionRow(s, live===s.id)).join("")}</div>`;
  }).join("");
}

function viewInfo(){
  const rows = [
    ["Dates","24–25 November 2026. Day 1 from 13:00, Day 2 from 09:00 to 16:45."],
    ["Venue","All sessions take place at the Medical University of Innsbruck, Fritz-Pregl-Straße 3, 8th floor."],
    ["Fireside Chat venue","The Fireside Chat on 24 November is the exception: Faculty Club, 1st floor, Schöpfstraße 41."],
    ["Who it is for","Pre- and postdocs from the basic and clinical sciences."],
    ["Language","All sessions are held in English."],
    ["Asking questions","The three panels and the fireside chat take audience questions. Open the session, tap “Ask a question”, and your question goes to the session chair."],
    ["Your plan","Bookmarked sessions are stored on this device only and are not visible to anyone else."],
    ["Contact","office@medlifelab.at"]
  ];
  return `
    <div class="cta">
      <div><div class="t">Registration</div>
      <div class="l"><a href="${REG_URL}" target="_blank" rel="noopener">forms.cloud.microsoft/e/UKiq912qcJ</a></div></div>
    </div>
    <div class="seclabel">Good to know</div>
    <div class="stack">
      ${rows.map(([k,v])=>`<div class="inforow"><span style="color:var(--brand-mid);flex:none">${svg(I.info,'style="width:18px;height:18px"')}</span>
        <div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div></div>`).join("")}
    </div>
    <div class="seclabel">Organised by</div>
    <div class="inforow"><div><div class="k">Medical University of Innsbruck</div>
      <div class="v">Supported by MedLifeLab — Innovation Hub of the Medical University of Innsbruck — and the Ludwig Boltzmann Gesellschaft Career Center.</div></div></div>
    <div class="suplogos" style="margin-top:10px">
      ${ASSETS.mll?`<img src="${ASSETS.mll}" alt="MedLifeLab">`:""}
      ${ASSETS.lbg?`<img src="${ASSETS.lbg}" alt="Ludwig Boltzmann Gesellschaft Career Center">`:""}
    </div>`;
}

const VIEWS = {programme:viewProgramme, speakers:viewSpeakers, questions:viewQuestions, plan:viewPlan, info:viewInfo};

function renderTabs(){
  const tabs = [
    ["programme","Programme",I.cal,0],
    ["speakers","Speakers",I.users,0],
    ["questions","Questions",I.chat,0],
    ["plan","My Plan",I.book,S.plan.length],
    ["info","Info",I.info,0]
  ];
  document.getElementById("tabs").innerHTML = tabs.map(([id,label,icon,badge])=>`
    <button data-tab="${id}" ${S.tab===id?'aria-current="page"':""}>
      <span style="position:relative;line-height:0">${svg(icon)}${badge?`<span class="badge">${badge}</span>`:""}</span>
      <span class="lbl">${label}</span>
    </button>`).join("");
}

function render(){
  document.getElementById("main").innerHTML = VIEWS[S.tab]();
  renderTabs();
  renderSheet();
}

/* ---------- sheets ---------- */
function renderSheet(){
  const host = document.getElementById("sheet");
  if (!S.sheet){ host.innerHTML = ""; document.body.style.overflow = ""; return; }
  document.body.style.overflow = "hidden";

  if (S.sheet.type === "form"){
    const s = byId(S.sheet.id);
    host.innerHTML = `<div class="scrim" data-scrim>
      <div class="formsheet" role="dialog" aria-modal="true" aria-label="Ask a question">
        <div class="formbar">
          <div class="t"><b>Ask a question</b><span>${esc(s.title)} · ${s.t}</span></div>
          <button class="xbtn" data-close aria-label="Close">${svg(I.x)}</button>
        </div>
        <div class="formwrap">
          <iframe src="${embedURL(FORMS[s.id])}" title="Question form" allowfullscreen></iframe>
        </div>
        <div class="formfoot">
          <a href="${FORMS[s.id]}" target="_blank" rel="noopener">${svg(I.ext,'style="width:14px;height:14px;flex:none"')} Form not loading? Open it in a new tab</a>
        </div>
      </div></div>`;
    return;
  }

  let inner = "";
  if (S.sheet.type === "session"){
    const s = byId(S.sheet.id);
    const live = liveId() === s.id;
    inner = `
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        <span class="kind">${KIND[s.kind]}</span>
        ${live?`<span class="livetag"><span class="dot"></span>LIVE NOW</span>`:""}
      </div>
      <h2>${esc(s.title)}</h2>
      <div class="sheetmeta">
        <span>${s.t}${s.end?"–"+s.end:""}</span>
        <span>${esc(DAYS.find(d=>d.id===s.day).nice)}</span>
      </div>
      <div class="venuebox">${svg(I.pin,'style="width:15px;height:15px;flex:none"')}<span>${esc(venueOf(s).full)}</span></div>
      ${s.desc?`<div class="prose">${s.desc.split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
      ${s.takeaways?`<div class="seclabel" style="margin-top:14px">Takeaways</div><ul class="takeaways">${s.takeaways.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
      ${hasForm(s.id)?`<button class="btn primary" data-form="${s.id}">${svg(I.chat,'style="width:16px;height:16px"')} Ask a question</button>`:""}
      <button class="btn" data-plan="${s.id}" aria-pressed="${S.plan.includes(s.id)}">
        ${S.plan.includes(s.id)?svg(I.check,'style="width:16px;height:16px"')+" Saved to my plan":svg(I.book,'style="width:16px;height:16px"')+" Save to my plan"}
      </button>
      ${s.people?`<div class="seclabel" style="margin-top:16px">${s.kind==="workshop"?"Trainers":"Speakers"}</div><div class="people">${s.people.map(personCard).join("")}</div>`:""}
    `;
  } else {
    const p = PEOPLE[S.sheet.id], img = ASSETS.photos[S.sheet.id];
    const ini = p.n.split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
    const appears = SESSIONS.filter(s => (s.people||[]).includes(S.sheet.id));
    inner = `
      ${img?`<img src="${img}" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover">`
           :`<div class="mono" style="width:76px;height:76px;font-size:24px">${ini}</div>`}
      <h2>${esc(p.n)}</h2>
      <div class="prole" style="font-size:13px">${esc(p.r)}</div>
      <div class="prose">${esc(p.b)}</div>
      ${appears.length?`<div class="seclabel" style="margin-top:16px">Sessions</div>
        <div class="stack">${appears.map(s=>`<div class="srow" data-open="${s.id}" role="button" tabindex="0">
          <div class="time"><b>${s.t}</b></div>
          <div class="body"><div class="ttl">${esc(s.title)}</div>
          <div class="sub">${esc(DAYS.find(d=>d.id===s.day).nice)}</div></div></div>`).join("")}</div>`:""}
    `;
  }

  host.innerHTML = `<div class="scrim" data-scrim>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheethead"><button class="xbtn" data-close aria-label="Close">${svg(I.x)}</button></div>
      <div class="sheetbody">${inner}</div>
    </div></div>`;
}

/* ============================================================ EVENTS */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-day],[data-preview],[data-plan],[data-open],[data-person],[data-form],[data-close],[data-scrim],[data-go]");
  if (!t) return;

  if (t.dataset.tab){ S.tab = t.dataset.tab; S.sheet = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.go){ S.tab = t.dataset.go; render(); window.scrollTo(0,0); return; }
  if (t.dataset.day){ S.day = t.dataset.day; render(); return; }
  if (t.hasAttribute("data-preview")){ S.preview = !S.preview; render(); return; }
  if (t.dataset.plan){
    e.stopPropagation();
    const id = t.dataset.plan;
    S.plan = S.plan.includes(id) ? S.plan.filter(x => x !== id) : [...S.plan, id];
    savePlan(); render(); return;
  }
  if (t.dataset.form){ S.sheet = {type:"form", id:t.dataset.form}; renderSheet(); return; }
  if (t.dataset.open){ S.sheet = {type:"session", id:t.dataset.open}; renderSheet(); return; }
  if (t.dataset.person){ S.sheet = {type:"person", id:t.dataset.person}; renderSheet(); return; }
  if (t.hasAttribute("data-close") || t.hasAttribute("data-scrim")){
    if (t.hasAttribute("data-scrim") && e.target !== t) return;
    S.sheet = null; renderSheet(); return;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet){ S.sheet = null; renderSheet(); return; }
  if (e.key === "Enter" || e.key === " "){
    const t = e.target.closest && e.target.closest("[data-open]");
    if (t){ e.preventDefault(); S.sheet = {type:"session", id:t.dataset.open}; renderSheet(); }
  }
});

/* ============================================================ BOOT */
document.getElementById("logo").src = ASSETS.logo;
loadPlan();
render();
</script>
